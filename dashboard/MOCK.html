<!doctype html>
<html lang="en" data-state="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-server Instrument Panel</title>
<style>
/* ============================================================================
   ai-server dashboard — STATIC VISUAL MOCK
   Deliverable 8.2 of dashboard/SPEC.md. Non-functional. Frozen readings.
   Self-contained: no network, no fonts, no libraries. Opens from file://.

   Design tokens
   -------------
   Ground / panels : cool blue-grey neutrals, deliberately hue-biased, not pure grey
   Series          : GPU 0 #3987e5 (solid) · GPU 1 #199e70 (dashed) · fan 5 #d95926
                     validated all-pairs against the #0d1116 surface,
                     protan/deutan dE 9.4 min, normal-vision dE 20.9 min
   Status          : good #0ca30c · warning #fab219 · critical #d03b3b
                     reserved; never used for a series. Always glyph + label.
   Numerals        : system monospace, tabular. Values stay in ink; state is
                     carried by chips, stripes and glyphs, so one amber cell is
                     the only thing that pulls the eye.
   ========================================================================= */

:root {
  color-scheme: dark;

  --ground:        #07090c;
  --panel:         #0d1116;
  --raised:        #11161d;
  --sunken:        #090c11;

  --hairline:      #1c232c;
  --hairline-lo:   #151b23;
  --hairline-hi:   #28313d;

  --ink:           #e4eaf1;
  --ink-2:         #98a5b4;
  --ink-3:         #6b7889;
  --ink-4:         #4a5566;

  --good:          #0ca30c;
  --good-ink:      #3fc63f;
  --warn:          #fab219;
  --warn-ink:      #fab219;
  --crit:          #d03b3b;
  --crit-ink:      #ef6a6a;

  --s-gpu0:        #3987e5;
  --s-gpu1:        #199e70;
  --s-fan:         #d95926;
  --meter:         #55697f;

  --mock:          #b07ad6;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas,
          "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --r: 3px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--s-gpu0);
  outline-offset: 2px;
}

/* ---------- shell ---------------------------------------------------- */

.app {
  max-width: 2200px;
  margin: 0 auto;
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* ---------- top bar --------------------------------------------------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 6px 13px;
  flex-wrap: wrap;
  padding: 9px 12px;
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
}

.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.brand__host {
  font-size: 15px; font-weight: 600; letter-spacing: .02em; color: var(--ink);
  white-space: nowrap;
}
.brand__meta { color: var(--ink-3); font-size: 11px; white-space: nowrap; }

.topbar__spacer { flex: 1 1 auto; }

.agg {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 10px 3px 8px;
  border: 1px solid var(--hairline-hi);
  border-radius: 999px;
  background: var(--raised);
  white-space: nowrap;
}
.agg__glyph { font-size: 11px; line-height: 1; }
.agg__text { font-size: 11px; letter-spacing: .03em; }
.agg[data-sev="ok"]   { border-color: rgba(12,163,12,.40); }
.agg[data-sev="ok"]   .agg__glyph { color: var(--good-ink); }
.agg[data-sev="warn"] { border-color: rgba(250,178,25,.42); }
.agg[data-sev="warn"] .agg__glyph { color: var(--warn-ink); }
.agg[data-sev="crit"] { border-color: rgba(208,59,59,.55); background: rgba(208,59,59,.10); }
.agg[data-sev="crit"] .agg__glyph { color: var(--crit-ink); }

/* MODE is a second, independent channel: the severity glyph answers "how is the
   machine", the mode answers "how current is this". Paused/stale therefore sit
   BESIDE the severity, never in place of it, and wear the neutral "no reading"
   hatch rather than a status hue — an amber pill would say "warning". */
.agg { padding-left: 4px; }
.agg__mode {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 8px 1px 7px;
  border: 1px solid var(--hairline-hi);
  border-radius: 999px 3px 3px 999px;
  background: repeating-linear-gradient(45deg, rgba(152,165,180,.14) 0 3px, transparent 3px 6px);
  color: var(--ink);
  font-size: 10.5px; letter-spacing: .04em;
}
.agg__mode[hidden] { display: none; }
.agg__mode i { font-style: normal; font-size: 9.5px; color: var(--ink-2); }

.snap { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; color: var(--ink-3); font-size: 11px; }
.snap > span { white-space: nowrap; }
.snap b { color: var(--ink-2); font-weight: 500; }

/* mock-viewer strip — deliberately NOT product chrome. Dashed, violet, and
   sitting outside the header so the real controls own the header's budget. */
.mockstrip {
  display: flex; align-items: center; gap: 6px 11px; flex-wrap: wrap;
  padding: 4px 6px 4px 10px;
  border: 1px dashed rgba(176,122,214,.55);
  border-radius: var(--r);
  background: rgba(176,122,214,.07);
}
.mockstrip__tag {
  font-family: var(--sans); font-weight: 700;
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--mock);
}
.mockstrip__seg { display: flex; gap: 3px; flex-wrap: wrap; }
.mockstrip__btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 9px;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
}
.mockstrip__btn:hover { color: var(--ink); background: rgba(176,122,214,.12); }
.mockstrip__btn[aria-pressed="true"] {
  color: #f0e2fb;
  background: rgba(176,122,214,.24);
  border-color: rgba(176,122,214,.60);
}
.mockstrip__note { font-size: 10px; color: var(--ink-4); }

/* ---------- header controls (real UI chrome, §6.2) --------------------- */

.ctl { display: flex; align-items: center; gap: 5px; }
.ctl__sel {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 3px 7px 3px 8px;
  border: 1px solid var(--hairline-hi); border-radius: 2px;
  background: var(--raised);
}
.ctl__k {
  font-family: var(--sans); font-size: 8.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-4);
}
.ctl__v { font-size: 11px; color: var(--ink); }
.ctl__caret { font-size: 7px; color: var(--ink-3); }
.ctl__btn {
  font-family: var(--mono); font-size: 11px; line-height: 1;
  min-width: 26px; height: 23px; padding: 0 7px;
  color: var(--ink-2); background: var(--raised);
  border: 1px solid var(--hairline-hi); border-radius: 2px; cursor: pointer;
}
.ctl__btn:hover { color: var(--ink); border-color: #3a4552; }
.ctl__btn[data-on="1"] {
  color: var(--ink); border-color: #3a4552;
  background: repeating-linear-gradient(45deg, rgba(152,165,180,.16) 0 3px, transparent 3px 6px);
}
.ctl__sep { width: 1px; align-self: stretch; background: var(--hairline-hi); margin: 0 3px; }

/* ---------- paused ------------------------------------------------------ */

.snap[data-stale="1"] {
  padding: 2px 6px; border-radius: 3px;
  background: repeating-linear-gradient(45deg, rgba(152,165,180,.15) 0 3px, transparent 3px 6px);
}
.snap[data-stale="1"] b { color: var(--ink); }
/* .banner--paused is declared ahead of .banner in this file, so it must out-
   specify it or the alarm banner's red background wins on source order. */
.banner.banner--paused {
  background: repeating-linear-gradient(45deg, rgba(152,165,180,.10) 0 4px, transparent 4px 8px), var(--raised);
  border-color: var(--hairline-hi);
  border-left-color: var(--ink-3);
}
.banner.banner--paused .banner__glyph { color: var(--ink-2); }
.banner.banner--paused .banner__count { color: var(--ink); }

/* ---------- login (§5.2) ------------------------------------------------ */

html[data-view="login"] .topbar,
html[data-view="login"] #bannerHost,
html[data-view="login"] .grid { display: none; }
html[data-view="panel"] #loginHost { display: none; }

.loginWrap { display: flex; flex-direction: column; gap: 10px; }
.loginLead {
  font-size: 10.5px; color: var(--ink-3);
  padding: 7px 10px;
  border: 1px solid var(--hairline); border-left: 2px solid var(--hairline-hi);
  border-radius: var(--r); background: var(--panel);
}
.loginLead b { color: var(--ink-2); font-weight: 500; }
.loginGrid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(262px, 1fr));
  align-items: start;
}
.loginVar { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.loginVar__lbl {
  font-family: var(--sans); font-weight: 600;
  font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
}
.loginVar__note { font-size: 10px; line-height: 1.4; color: var(--ink-4); }
.login {
  display: flex; flex-direction: column; gap: 9px;
  padding: 17px 15px 13px;
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
}
.login__mark { font-size: 17px; font-weight: 600; letter-spacing: .02em; color: var(--ink); line-height: 1.1; }
.login__addr { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.login__lbl {
  font-family: var(--sans); font-size: 9.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3);
  margin-bottom: -4px;
}
.login__in {
  font-family: var(--mono); font-size: 13px; letter-spacing: .14em;
  width: 100%; padding: 7px 9px;
  color: var(--ink); background: var(--sunken);
  border: 1px solid var(--hairline-hi); border-radius: 2px;
}
.login__in:focus { outline: none; border-color: var(--s-gpu0); box-shadow: 0 0 0 1px rgba(57,135,229,.45); }
.login__in[disabled] { opacity: .75; }
.login__go {
  font-family: var(--sans); font-size: 10.5px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 8px 10px;
  color: #eaf2fd; background: rgba(57,135,229,.22);
  border: 1px solid rgba(57,135,229,.65); border-radius: 2px; cursor: pointer;
}
.login__go:hover:not([disabled]) { background: rgba(57,135,229,.32); }
.login__go[disabled] { opacity: .42; cursor: not-allowed; }
/* always present, so all five cards share one height and one baseline */
.login__msg { display: flex; gap: 7px; font-size: 11px; line-height: 1.35; min-height: 15px; }
.login__msg i { font-style: normal; }
.login__msg[data-sev="crit"] { color: var(--crit-ink); }
.login__msg[data-sev="warn"] { color: var(--warn-ink); }
.login__disc {
  margin: 0; padding-top: 9px;
  border-top: 1px solid var(--hairline-lo);
  display: flex; gap: 7px;
  font-size: 10px; line-height: 1.45; color: var(--ink-3);
}
.login__disc i { font-style: normal; color: var(--warn-ink); }

/* ---------- alarm banner ---------------------------------------------- */

#bannerHost:empty { display: none; }

.banner {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 8px 12px;
  background: linear-gradient(90deg, rgba(208,59,59,.20), rgba(208,59,59,.07) 60%, rgba(208,59,59,.03));
  border: 1px solid rgba(208,59,59,.55);
  border-left: 3px solid var(--crit);
  border-radius: var(--r);
}
.banner__glyph { color: var(--crit-ink); font-size: 14px; line-height: 1.25; }
.banner__body { min-width: 0; flex: 1 1 auto; }
.banner__head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.banner__count {
  font-family: var(--sans); font-size: 10px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--crit-ink); font-weight: 700;
}
.banner__lead { font-size: 13px; color: var(--ink); }
.banner__lead b { color: #fff; font-weight: 600; }
.banner__since { color: var(--ink-3); font-size: 11px; }
.banner__rest {
  margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px 8px;
}
.banner__item {
  display: inline-flex; align-items: baseline; gap: 7px;
  font-size: 11px; color: var(--ink-2);
  padding: 2px 8px;
  border: 1px solid rgba(208,59,59,.32);
  border-radius: 2px;
  background: rgba(208,59,59,.06);
}
.banner__item i { font-style: normal; color: var(--ink-3); }

/* ---------- grid ------------------------------------------------------ */

/* >=1280: the single-screen wall panel. Explicit placement, so the tall
   cooling module sits beside two stacked short panels instead of leaving a
   column of dead ground under them. */
.grid {
  display: grid;
  gap: 9px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: start;
}
.p-gpu0 { grid-column: 1 / 3; grid-row: 1; }
.p-gpu1 { grid-column: 3 / 5; grid-row: 1; }
.p-cool { grid-column: 1 / 3; grid-row: 2 / span 2; align-self: stretch; }
.p-cpu  { grid-column: 3;     grid-row: 2; }
.p-ram  { grid-column: 4;     grid-row: 2; }
.p-safe { grid-column: 3;     grid-row: 3; }
.p-store{ grid-column: 4;     grid-row: 3; }
.p-serv { grid-column: 1 / 3; grid-row: 4; }
.p-log  { grid-column: 3 / 5; grid-row: 4; }

@media (max-width: 1279px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .p-gpu0, .p-gpu1, .p-cpu, .p-ram, .p-safe, .p-store { grid-column: auto; grid-row: auto; }
  .p-cool, .p-serv, .p-log { grid-column: span 2; grid-row: auto; align-self: start; }
}

@media (max-width: 899px) {
  .app { padding: 10px 10px 14px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .p-gpu0, .p-gpu1, .p-cool, .p-serv, .p-log,
  .p-cpu, .p-ram, .p-safe, .p-store { grid-column: span 1; grid-row: auto; align-self: start; }
  /* priority order per SPEC 6.1: GPUs -> cooling -> safety -> serving -> host -> storage */
  .p-gpu0 { order: 1; } .p-gpu1 { order: 2; } .p-cool { order: 3; }
  .p-safe { order: 4; } .p-serv { order: 5; } .p-cpu { order: 6; }
  .p-ram  { order: 7; } .p-store { order: 8; } .p-log { order: 9; }
}

/* ---------- panel ----------------------------------------------------- */

.panel {
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  padding: 8px 10px 9px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.panel__hd {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--hairline-lo);
}
.panel__title {
  font-family: var(--sans);
  font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap;
}
.panel__sub {
  font-size: 11px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.panel__hd .sp { flex: 1 1 auto; }

/* severity stripe on a panel that is not nominal */
.panel[data-sev="warn"] { border-color: rgba(250,178,25,.34); }
.panel[data-sev="crit"] { border-color: rgba(208,59,59,.46); }
.panel[data-sev="crit"] { background: linear-gradient(180deg, rgba(208,59,59,.045), transparent 90px), var(--panel); }

/* ---------- chips ----------------------------------------------------- */

.chip {
  display: inline-flex; align-items: baseline; gap: 5px;
  font-family: var(--sans);
  font-size: 9.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
  border: 1px solid var(--hairline-hi);
  background: rgba(152,165,180,.07);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip i { font-style: normal; font-size: 9px; }
.chip--ok   { border-color: rgba(12,163,12,.45);  background: rgba(12,163,12,.12);  color: var(--good-ink); }
.chip--warn { border-color: rgba(250,178,25,.48); background: rgba(250,178,25,.13); color: var(--warn-ink); }
.chip--crit { border-color: rgba(208,59,59,.58);  background: rgba(208,59,59,.16);  color: var(--crit-ink); }
.chip--unk  { border-color: var(--hairline-hi);   background: repeating-linear-gradient(45deg, rgba(152,165,180,.10) 0 3px, transparent 3px 6px); color: var(--ink-2); }
/* hex codes and unit strings must not be shouted into 0X4 by text-transform */
.chip--code { text-transform: none; letter-spacing: .03em; font-family: var(--mono); font-weight: 400; font-size: 10px; }

/* ---------- readouts -------------------------------------------------- */

.hero {
  display: flex; align-items: flex-end; gap: 4px;
  line-height: .95;
}
.hero__v { font-size: 34px; font-weight: 500; letter-spacing: -.02em; color: var(--ink); }
.hero__u { font-size: 13px; color: var(--ink-3); padding-bottom: 3px; }
.hero--crit .hero__v { color: #fff; text-shadow: 0 0 22px rgba(208,59,59,.55); }
.hero--warn .hero__v { color: #fff; }
/* an unreadable channel: the value slot is struck through with the same hatch
   the chart uses for "no reading", so it can never be mistaken for a zero */
.hero--unk  .hero__v {
  color: var(--ink-3); font-size: 28px; letter-spacing: .1em;
  padding: 0 8px;
  background: repeating-linear-gradient(45deg, rgba(152,165,180,.13) 0 3px, transparent 3px 6px);
  border: 1px solid var(--hairline-hi);
}

.gpuTop { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.gpuTop__spark { flex: 1 1 130px; min-width: 110px; }
.gpuTop__pw { text-align: right; margin-left: auto; }
.gpuTop__pw .n { font-size: 18px; color: var(--ink); }
.gpuTop__pw .u { font-size: 11px; color: var(--ink-3); }

.caption {
  font-size: 10.5px; color: var(--ink-3);
  display: flex; gap: 10px; flex-wrap: wrap;
  min-height: 14px;
}
.caption b { color: var(--ink-2); font-weight: 500; }

/* meter */
.meterRow { display: flex; flex-direction: column; gap: 3px; }
.meterRow__lbl {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 10.5px; color: var(--ink-3);
}
.meterRow__lbl b { color: var(--ink-2); font-weight: 500; }
.meter {
  position: relative;
  height: 6px;
  background: var(--sunken);
  border: 1px solid var(--hairline-lo);
  border-radius: 1px;
  overflow: hidden;
}
.meter__fill { position: absolute; inset: 0 auto 0 0; background: var(--meter); }
.meter__fill[data-sev="warn"] { background: var(--warn); }
.meter__fill[data-sev="crit"] { background: var(--crit); }
.meter__tick {
  position: absolute; top: -1px; bottom: -1px; width: 1px;
  background: var(--hairline-hi);
}

/* key / value strip */
.strip {
  display: flex; flex-wrap: wrap; gap: 3px 20px;
  font-size: 11px;
}
.strip > div { display: flex; gap: 7px; min-width: 0; align-items: baseline; }
.strip dt, .strip .k { color: var(--ink-3); }
.strip dd, .strip .v { margin: 0; color: var(--ink); white-space: nowrap; }

.rows { display: flex; flex-direction: column; gap: 1px; }
.row {
  display: flex; align-items: center; gap: 6px 9px; flex-wrap: wrap;
  padding: 4px 7px; line-height: 1.25;
  background: var(--raised);
  border-left: 2px solid var(--hairline-hi);
  min-width: 0;
}
.row[data-sev="ok"]   { border-left-color: rgba(12,163,12,.55); }
.row[data-sev="warn"] { border-left-color: var(--warn); background: rgba(250,178,25,.07); }
.row[data-sev="crit"] { border-left-color: var(--crit); background: rgba(208,59,59,.09); }
.row[data-sev="unk"]  { border-left-color: var(--ink-4); }
.row__glyph { width: 11px; text-align: center; font-size: 10px; flex: 0 0 auto; }
.row[data-sev="ok"]   .row__glyph { color: var(--good-ink); }
.row[data-sev="warn"] .row__glyph { color: var(--warn-ink); }
.row[data-sev="crit"] .row__glyph { color: var(--crit-ink); }
.row[data-sev="unk"]  .row__glyph { color: var(--ink-3); }
.row__name { color: var(--ink); flex: 0 0 auto; }
/* notes wrap rather than truncate — a clipped reason is worse than a tall row */
.row__note { color: var(--ink-3); font-size: 10.5px; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
.row__note--full { flex: 1 0 100%; padding-left: 20px; }
.row__end { margin-left: auto; flex: 0 1 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }

/* fan channel table */
.chan {
  display: grid;
  grid-template-columns: auto auto auto minmax(0, 1fr);
  gap: 3px 10px;
  align-items: center;
  font-size: 11px;
}
.chan__id { color: var(--ink-3); }
.chan__v  { color: var(--ink); text-align: right; min-width: 42px; }
.chan__v--unk { color: var(--ink-3); letter-spacing: .18em; }
.chan__v--zero { color: var(--crit-ink); }
.chan__n  { color: var(--ink-3); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.note {
  font-size: 9.5px; line-height: 1.4; color: var(--ink-4);
  border-top: 1px solid var(--hairline-lo);
  padding-top: 5px;
}
.note b { color: var(--ink-3); font-weight: 400; }

/* ---------- charts ---------------------------------------------------- */

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; }
.chart:focus-visible { outline-offset: 0; }

.legend {
  display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 10.5px; color: var(--ink-2);
  align-items: center;

  overflow-x: auto;

.sevTag[data-sev="warn"] { color: var(--warn-ink); }

.foot {

function fmtInt(v)   { return v.toLocaleString("en-US"); }          /* VRAM MiB, RPM, MHz */
function fmtPct1(v)  { return v.toFixed(1) + " %"; }                /* every percentage  */
function fmtW(v)     { return v.toFixed(1) + " W"; }                /* power.draw        */
function fmtGiB(v)   { return v.toFixed(1); }                       /* RAM               */
function fmtSwap(v)  { return v.toFixed(2); }                       /* 0.02 must not become 0.0 */
function fmtGB(v)    { return v.toFixed(1); }                       /* disk              */
function sig2(v) {                                                  /* 2 significant figures */
  if (!isFinite(v) || v === 0) return "0";
  var m = Math.pow(10, 1 - Math.floor(Math.log10(Math.abs(v))));
  var r = Math.round(v * m) / m;
  var d = Math.max(0, 1 - Math.floor(Math.log10(Math.abs(r))));
  return r.toFixed(d);
}

  if (bytesPerSec === null || bytesPerSec === undefined) return "—";
  return bytesPerSec >= 1e6 ? sig2(bytesPerSec / 1e6) + " MB/s"
                            : sig2(bytesPerSec / 1e3) + " KB/s";
}

  try {
    var parts = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" }).formatToParts(new Date());
    for (var i = 0; i < parts.length; i++) if (parts[i].type === "timeZoneName") return parts[i].value;
  } catch (e) { /* fall through */ }
  return "local";
}

  var mn = Infinity, mx = -Infinity;

function wander(n, amp, seed, alpha) {
  var r = rng(seed), out = new Array(n), v = 0;

function drawSpark(host, cfg) {
  var W = Math.max(90, host.clientWidth || 130);

  var H = tall ? 50 : 38;
  var padT = 4, padB = tall ? 10 : 4, padR = 26;
  clear(host);

  var vals = cfg.values, lo = cfg.min, hi = cfg.max;
  var x = function (i) { return (i / (vals.length - 1)) * (W - padR); };
  var y = function (v) { return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); };

  var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, "aria-hidden": "true" });

  if (tall && cfg.refs) {
    cfg.refs.forEach(function (r) {
      svg.appendChild(svgEl("line", { x1: 0, x2: W - padR, y1: y(r.v), y2: y(r.v),
        stroke: r.c, "stroke-width": 1, "stroke-dasharray": "3 3", opacity: .55 }));
      var lb = svgEl("text", { x: W - padR + 3, y: y(r.v) + 3, fill: PAL.tick, "font-size": 8.5 });
      lb.textContent = r.label; svg.appendChild(lb);

  }

  svg.appendChild(svgEl("path", { d: areaFrom(vals, x, y, H - padB), fill: cfg.color, opacity: .10 }));
  svg.appendChild(svgEl("path", { d: pathFrom(vals, x, y), fill: "none", stroke: cfg.color,
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
    "stroke-dasharray": cfg.dash || null }));

  var li = lastDefined(vals);
  if (li >= 0) {
    svg.appendChild(svgEl("circle", { cx: x(li), cy: y(vals[li]), r: 4.5,
      fill: cfg.color, stroke: PAL.surface, "stroke-width": 2 }));
  }
  /* a paused client has no samples for this span — hatch it, never interpolate */
  if (cfg.pausedFrom !== undefined && cfg.pausedFrom !== null && cfg.pausedFrom < vals.length - 1) {
    svg.appendChild(svgEl("rect", { x: x(cfg.pausedFrom), y: padT,
      width: (W - padR) - x(cfg.pausedFrom), height: H - padT - padB,
      fill: "url(#nodata)", opacity: .55 }));
  }
  if (tall) {
    var t0 = svgEl("text", { x: 0, y: H - 1, fill: PAL.tick, "font-size": 8.5 });
    t0.textContent = hhmm(cfg.time[0]); svg.appendChild(t0);
    var t1 = svgEl("text", { x: W - padR, y: H - 1, fill: PAL.tick, "font-size": 8.5, "text-anchor": "end" });
    t1.textContent = hhmm(cfg.time[cfg.time.length - 1]); svg.appendChild(t1);

  /* hover / focus readout — writes into the card's own caption, never a

      i = Math.max(0, Math.min(vals.length - 1, i));
      var v = vals[i];
      cfg.readout.textContent = hhmmss(cfg.time[i]) + "   " +
        (v === null || v === undefined ? "no reading" : cfg.fmt(v));
    };
    host.addEventListener("pointermove", move);
    host.addEventListener("pointerleave", function () { cfg.readout.textContent = base; });
  }

    tip.style.left = Math.max(2, Math.min(W - tw - 2, px - tw / 2)) + "px";
    tip.style.top = "2px";
    tip.style.width = tw + "px";
  }
  function hide() {
    cross.setAttribute("opacity", 0);
    dots.forEach(function (d) { d.setAttribute("opacity", 0); });
    tip.removeAttribute("data-on");
  }
  host.addEventListener("pointermove", function (ev) {
    var r = host.getBoundingClientRect();
    var i = Math.round(((ev.clientX - r.left - padL) / plotW) * (n - 1));
    show(Math.max(0, Math.min(n - 1, i)));
  });
  host.addEventListener("pointerleave", hide);
  host.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft")  { show(Math.max(0, (cursor < 0 ? n - 1 : cursor) - 6)); ev.preventDefault(); }
    if (ev.key === "ArrowRight") { show(Math.min(n - 1, (cursor < 0 ? 0 : cursor) + 6)); ev.preventDefault(); }
    if (ev.key === "Escape") hide();
  });
  host.addEventListener("blur", hide);
}

   7.  Mount
   ========================================================================== */

pinLast("a"); pinLast("b");

/* Last sample before the client paused polling, per state. State B pauses after
   the last of its six alarms has already been raised, so the paused view is a
   true subset of what that client had actually seen. */
var PAUSE_KEEP = { a: 327, b: 351 };
var TZ = tzAbbr();

/* A paused client's series simply stop: the tail is absent, never zero. */
function truncSeries(src, keep) {
  var o = { time: src.time, pausedFrom: keep };
  ["gpu0", "gpu1", "fan5", "cpu", "cpuT"].forEach(function (k) {
    o[k] = src[k].map(function (v, i) { return i > keep ? null : v; });
  });
  return o;
}

/* The displayed figures become the last snapshot actually received, not "now". */
function pausedSnap(src, series, keep) {
  var c = JSON.parse(JSON.stringify(src));
  var at = hhmmss(series.time[keep]);
  c.paused = true;
  c.pausedAt = at;
  c.pausedGapS = (series.time.length - 1 - keep) * TICK;
  c.ts = at;
  c.age = fmtDur(c.pausedGapS) + " ago";
  c.stale = true;
  /* c.agg is left exactly as the live snapshot had it — the severity and its
     counts are facts about the machine and pausing the client changes neither. */
  c.mode = { id: "paused", glyph: "❙❙", label: "paused" };
  c.gpus[0].temp = series.gpu0[keep]; c.gpus[0].sev = tempSev(series.gpu0[keep]);
  c.gpus[1].temp = series.gpu1[keep]; c.gpus[1].sev = tempSev(series.gpu1[keep]);
  if (c.cooling.fan5 !== null && series.fan5[keep] !== null) c.cooling.fan5 = series.fan5[keep];
  c.cpu.util = series.cpu[keep];
  c.events = src.events.filter(function (e) { return e.t <= at; });
  return c;
}

var current = "a";
var lastView = null;

function render() {
  var isLogin = current === "c";
  var view = isLogin ? "login" : "panel";
  document.documentElement.setAttribute("data-view", view);
  document.documentElement.setAttribute("data-state", current);

  var lit = current === "bp" ? "b" : current;     /* B-paused is still state B */
  [].forEach.call(document.querySelectorAll(".mockstrip__btn"), function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-go") === lit ? "true" : "false");
  });

  if (isLogin) {
    renderLogin(document.getElementById("loginHost"));
    if (lastView !== "login") {
      var f = document.getElementById("pw-idle");
      if (f) f.focus();
    }
    lastView = view;
    return;
  }
  lastView = view;

  var key = (current === "ap") ? "a" : (current === "bp") ? "b" : current;
  var paused = (current === "ap" || current === "bp");
  var keep = PAUSE_KEEP[key];
  var s = paused ? truncSeries(SERIES[key], keep) : SERIES[key];
  var snap = paused ? pausedSnap(DATA[key], SERIES[key], keep) : DATA[key];

  document.getElementById("hostMeta").textContent = snap.hostMeta;
  document.getElementById("snapTs").textContent = snap.ts;
  document.getElementById("snapTz").textContent = TZ;
  document.getElementById("snapAge").textContent = snap.age;
  document.getElementById("snap").setAttribute("data-stale", snap.stale ? "1" : "0");

  /* Two channels, side by side: mode (how current) then severity (how is it). */
  var agg = document.getElementById("agg");
  agg.setAttribute("data-sev", snap.agg.sev);
  var modeEl = document.getElementById("aggMode");
  if (snap.mode) {
    agg.setAttribute("data-mode", snap.mode.id);
    document.getElementById("aggModeGlyph").textContent = snap.mode.glyph;
    document.getElementById("aggModeText").textContent = snap.mode.label;
    modeEl.hidden = false;
  } else {
    agg.removeAttribute("data-mode");
    document.getElementById("aggModeGlyph").textContent = "";
    document.getElementById("aggModeText").textContent = "";
    modeEl.hidden = true;
  }
  document.getElementById("aggGlyph").textContent = snap.agg.glyph;
  document.getElementById("aggText").textContent = snap.agg.text;

  var pb = document.getElementById("ctlPause");
  pb.textContent = paused ? "▶" : "❙❙";
  pb.setAttribute("data-on", paused ? "1" : "0");
  pb.title = paused ? "Resume polling"
    : "Pause polling";
  pb.setAttribute("aria-label", pb.title);

  renderBanner(document.getElementById("bannerHost"), snap);
  renderGPU(document.getElementById("gpu0"), snap.gpus[0], s, snap);
  renderGPU(document.getElementById("gpu1"), snap.gpus[1], s, snap);
  renderCooling(document.getElementById("cool"), snap, s);
  renderCPU(document.getElementById("cpu"), snap, s);
  renderRAM(document.getElementById("ram"), snap);
  renderServing(document.getElementById("serv"), snap);
  renderSafety(document.getElementById("safe"), snap);
  renderStorage(document.getElementById("store"), snap);
  renderLog(document.getElementById("log"), snap);
}

[].forEach.call(document.querySelectorAll(".mockstrip__btn"), function (b) {
  b.addEventListener("click", function () { current = b.getAttribute("data-go"); render(); });
});

/* The pause control is the one header control wired up, because it is the one
   whose effect is a visual state a reviewer needs to see. */
document.getElementById("ctlPause").addEventListener("click", function () {
  var next = { a: "ap", ap: "a", b: "bp", bp: "b" }[current];
  if (!next) return;                       /* the login route has nothing to pause */
  current = next;
  render();
});

var rt;
window.addEventListener("resize", function () {
  clearTimeout(rt);
  rt = setTimeout(render, 120);
});

render();

})();
</script>
</body>
</html>
